<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · WhatsApp Campaign Sender</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
</head>
<body class="centered">
  <div class="loginbox">
    <div class="brand"><span class="dot"></span> WhatsApp Campaign Sender</div>

    <div id="setupMode" class="hidden">
      <h2>Choose a password</h2>
      <p class="muted small">This protects your client list and your WhatsApp number. Anyone who reaches this page
        without it can send messages as you, so pick something real — at least 8 characters.</p>
      <input type="password" id="newPassword" placeholder="new password" autocomplete="new-password">
      <input type="password" id="newPassword2" placeholder="repeat it" autocomplete="new-password">
      <button id="btnSetup" class="primary big">Set password &amp; continue</button>
    </div>

    <div id="loginMode" class="hidden">
      <h2>Sign in</h2>
      <input type="password" id="password" placeholder="password" autocomplete="current-password">
      <button id="btnLogin" class="primary big">Sign in</button>
    </div>

    <p id="envNote" class="muted small hidden"></p>
    <p id="err" class="result bad"></p>
  </div>
<script src="login.js"></script>
</body>
</html>
