<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · WhatsApp Campaigns</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="logo.svg">
</head>
<body class="centered">
  <div class="loginbox">
    <div class="logo">
      <img src="logo.svg" alt="">
      <b>WhatsApp Campaigns</b>
    </div>

    <div id="setupMode" class="hidden">
      <h2>Choose a password</h2>
      <p class="hint">This protects your client list and your WhatsApp number. Anyone who reaches this page
        without it can send messages as you — pick something real, at least 8 characters.</p>
      <div class="field"><label class="label" for="newPassword">New password</label>
        <input type="password" id="newPassword" autocomplete="new-password"></div>
      <div class="field"><label class="label" for="newPassword2">Repeat it</label>
        <input type="password" id="newPassword2" autocomplete="new-password"></div>
      <button class="btn btn-primary btn-lg btn-block" id="btnSetup">Set password &amp; continue</button>
    </div>

    <div id="loginMode" class="hidden">
      <h2>Sign in</h2>
      <p class="hint">Enter your password to continue.</p>
      <div class="field"><label class="label" for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password"></div>
      <button class="btn btn-primary btn-lg btn-block" id="btnLogin">Sign in</button>
    </div>

    <p id="envNote" class="hint hidden" style="margin-top:14px"></p>
    <p id="err" class="result bad"></p>
  </div>
<script src="login.js"></script>
</body>
</html>
